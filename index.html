<!DOCTYPE html>
<html lang="id" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Judul wajib diisi agar objek Open Graph valid di Facebook. -->
    <title>Nama Ayah</title>
    <link rel="canonical" href="https://ghiwenk1.github.io/namaayah/">

    <!-- Metadata yang dibaca crawler Facebook. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ghiwenk1.github.io/namaayah/">
    <meta property="og:site_name" content="Dramaqu">
    <meta property="og:title" content="Nama Ayah">
    <meta property="og:description" content="Lihat kisah selengkapnya.">
    <meta property="og:locale" content="id_ID">

    <!--
        ?v=2 memaksa Facebook mengambil versi gambar baru.
        Naikkan menjadi ?v=3 jika gambar diganti lagi dengan nama yang sama.
    -->
    <meta property="og:image"
          content="https://ghiwenk1.github.io/namaayah/namaayah.jpg?v=2">
    <meta property="og:image:secure_url"
          content="https://ghiwenk1.github.io/namaayah/namaayah.jpg?v=2">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="276">
    <meta property="og:image:height" content="488">
    <meta property="og:image:alt" content="Gambar kisah Nama Ayah">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
        }
        a {
            display: block;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }
        a:focus-visible {
            outline: 3px solid #ee4d2d;
            outline-offset: -3px;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            border: 0;
        }
    </style>
</head>
<body>
    <!-- Gambar tetap bisa diklik jika JavaScript diblokir. -->
    <a id="shopee-link"
       href="https://s.shopee.co.id/5q7qtfchR1"
       rel="sponsored"
       aria-label="Buka tautan afiliasi Shopee">
        <img src="namaayah.jpg"
             width="276"
             height="488"
             alt="Gambar kisah Nama Ayah"
             fetchpriority="high">
    </a>

    <script>
        const shopeeLink = document.getElementById("shopee-link");
        window.location.replace(shopeeLink.href);
    </script>
</body>
</html>
